version: '3'

networks:
    blah2:
      external: true

services:

  blah2:
    restart: always
    build: .
    image: blah2
    tty: true
    depends_on: 
      - blah2_api
    volumes:
      - ./config:/blah2/config
      - /opt/blah2/save:/blah2/save
      - /dev/shm:/dev/shm:rw
      - /dev/usb:/dev/usb:rw
    network_mode: host
    privileged: true
    command: "/blah2/bin/blah2 -c config/config.yml"
    container_name: blah2

  blah2_web:
    restart: always
    image: httpd:2.4
    ports: 
      - 49152:80
    volumes:
      - ./html:/usr/local/apache2/htdocs
    networks:
      - blah2
    container_name: blah2-web

  blah2_api:
    restart: always
    build: ./api
    image: blah2_api
    volumes:
      - ./config:/usr/src/app/config
    network_mode: host
    command: "node server.js /usr/src/app/config/config.yml"
    container_name: blah2-api

  # ── multi profile — 3 independent nodes on one host ──────────────────────────
  # Config: config/config-rspduo-node{1,2,3}.yml  or  config/config-b210-node{1,2,3}.yml
  # Swap the volume source paths below to switch between RSPDuo and B210.
  # Usage: mkdir -p /opt/blah2/save/node{1,2,3} && sudo docker compose --profile multi up -d --build
  blah2-node1:
    profiles: [multi]
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    image: blah2
    tty: true
    depends_on:
      - blah2-api-node1
    volumes:
      - ./config/config-rspduo-node1.yml:/blah2/config/config.yml
      - /opt/blah2/save/node1:/blah2/save
      - /dev/shm:/dev/shm:rw
      - /dev/usb:/dev/usb:rw
    network_mode: host
    privileged: true
    command: "/blah2/bin/blah2 -c config/config.yml"
    container_name: blah2-node1

  blah2-api-node1:
    profiles: [multi]
    restart: always
    build: ./api
    image: blah2-api
    volumes:
      - ./config/config-rspduo-node1.yml:/usr/src/app/config/config.yml
    network_mode: host
    command: "node server.js /usr/src/app/config/config.yml"
    container_name: blah2-api-node1

  blah2-web-node1:
    profiles: [multi]
    restart: always
    image: httpd:2.4
    ports:
      - "49152:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs
    networks:
      - blah2
    container_name: blah2-web-node1

  blah2-node2:
    profiles: [multi]
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    image: blah2
    tty: true
    depends_on:
      - blah2-api-node2
    volumes:
      - ./config/config-rspduo-node2.yml:/blah2/config/config.yml
      - /opt/blah2/save/node2:/blah2/save
      - /dev/shm:/dev/shm:rw
      - /dev/usb:/dev/usb:rw
    network_mode: host
    privileged: true
    command: "/blah2/bin/blah2 -c config/config.yml"
    container_name: blah2-node2

  blah2-api-node2:
    profiles: [multi]
    restart: always
    build: ./api
    image: blah2-api
    volumes:
      - ./config/config-rspduo-node2.yml:/usr/src/app/config/config.yml
    network_mode: host
    command: "node server.js /usr/src/app/config/config.yml"
    container_name: blah2-api-node2

  blah2-web-node2:
    profiles: [multi]
    restart: always
    image: httpd:2.4
    ports:
      - "49153:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs
    networks:
      - blah2
    container_name: blah2-web-node2

  blah2-node3:
    profiles: [multi]
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    image: blah2
    tty: true
    depends_on:
      - blah2-api-node3
    volumes:
      - ./config/config-rspduo-node3.yml:/blah2/config/config.yml
      - /opt/blah2/save/node3:/blah2/save
      - /dev/shm:/dev/shm:rw
      - /dev/usb:/dev/usb:rw
    network_mode: host
    privileged: true
    command: "/blah2/bin/blah2 -c config/config.yml"
    container_name: blah2-node3

  blah2-api-node3:
    profiles: [multi]
    restart: always
    build: ./api
    image: blah2-api
    volumes:
      - ./config/config-rspduo-node3.yml:/usr/src/app/config/config.yml
    network_mode: host
    command: "node server.js /usr/src/app/config/config.yml"
    container_name: blah2-api-node3

  blah2-web-node3:
    profiles: [multi]
    restart: always
    image: httpd:2.4
    ports:
      - "49154:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs
    networks:
      - blah2
    container_name: blah2-web-node3
